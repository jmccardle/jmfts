[project]
name = "jmfts"
version = "0.1.0"
description = "John McCardle's Fusion Tree Search - A focused retrieval appliance with matryoshka embeddings and late interaction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    # Required by the multipart upload route (POST /ingest/file). NOT optional and NOT
    # lazy: FastAPI checks for it while the ROUTE IS BUILT, i.e. at `import api.main`, so
    # its absence is an import-time crash of the whole application, not a 500 on one
    # endpoint. It was previously present only as a transitive dependency of `mcp`.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sentence-transformers>=2.2.2",
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "httpx>=0.26.0",
    "ruptures>=1.1.8",
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "markdown-it-py>=3.0.0",
    "pymupdf>=1.24",
    "markdownify>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jmfts_core*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
