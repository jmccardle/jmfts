<!--
  docs/SPRINT_0_6_0.md Block F step 24. This document is the SHELL, and it is deliberately
  almost empty.

  Until this step it was the whole front end: the capability table, the token form, the call
  log and every line of script that drew them. Step 24 moved all of it — the table became
  `views/capabilities.js`, a registered view like any other, and the frame around it became
  `shell/shell.js`. What is left here is a mount point and one import, and that is the point:
  Phase F3 forks five worktrees that each add a view (steps 26 to 30), and none of them has a
  reason to edit this file. A view is a file in `views/` plus one appended line in
  `shell/manifest.js`. See `shell/registry.js` for IC-7 and `shell/manifest.js` for why that
  one shared line still merges cleanly from two branches at once.

  Everything reachable from here calls `./client/`, which is generated from `/openapi.json` by
  `scripts/generate_ts_client.py`, and the call log is the client's own event stream rather
  than something a page keeps. That is what makes "the front end thinly wraps the API"
  checkable: a row the log has no call for would be something computed in the browser, and you
  could see that from the log.

  No build step, no framework, no CDN. `./shell/`, `./views/`, `./render/` and `./client/` are
  ES modules the browser runs as they stand, and nothing here loads from another origin —
  `tests/test_ts_client_codegen.py::test_nothing_in_the_bundle_loads_from_the_network` holds
  the whole bundle to that, because an appliance is expected to run air-gapped and a page that
  renders blank without internet is worse than no page.
