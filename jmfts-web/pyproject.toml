[project]
name = "jmfts-web"
# Same rule as the other two distributions: the version is not a literal here, it is read
# from ``jmfts_web.__version__``. tests/test_packaging.py forbids a second copy.
dynamic = ["version"]
description = "Browser front end for a JMFTS retrieval appliance"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fight Fire with Fire Robotics, LLC" }]
keywords = ["jmfts", "retrieval", "ui", "frontend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

# NO DEPENDENCIES, AND THAT IS THE POINT OF THE DISTRIBUTION.
#
# This wheel carries built static files and one module that says where they are. It does not
# import the appliance, it does not import a web framework, and it does not import the
# client: everything the front end does at runtime it does over HTTP, in the browser, using
# the same REST API any other consumer calls. A dependency here would be a dependency the
# appliance inherits from installing `jmfts[web]`, which is the cost this split exists to
# avoid paying on a worker that will never serve a page.
dependencies = []

[project.urls]
Homepage = "https://github.com/jmccardle/jmfts"
Repository = "https://github.com/jmccardle/jmfts"

[build-system]
# >= 77.0.3 for PEP 639 `license-files`, exactly as the other two distributions require.
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "jmfts_web.__version__" }

[tool.setuptools.packages.find]
include = ["jmfts_web*"]

# The bundle is DATA, not Python, so `packages.find` alone does not ship it. Without this
# the wheel installs a module whose `static_dir()` raises FileNotFoundError on every call —
# which `jmfts_web.static_dir` is written to report clearly, and which nobody should ever
# have to read.
[tool.setuptools.package-data]
jmfts_web = ["static/**/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Repeated here for the reason jmfts-client/pyproject.toml gives at length: ruff resolves
# configuration per file to the nearest pyproject.toml above it, and a `[tool.ruff]` block
# with no `lint.select` falls back to ruff's DEFAULT set rather than to the root's list.
# A third distribution is a third place that has to say so.
select = ["E4", "E7", "E9", "F"]
