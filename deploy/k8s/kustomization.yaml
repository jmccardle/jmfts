# kubectl apply -k deploy/k8s/
#
# The secret is NOT listed: 11-secret.example.yaml is a template, and applying it would
# install the literal string CHANGE-ME as the database password. Create the real one first
# (the command is in that file).
#
# 40-keda-scaledobject.yaml is also not listed, because it needs KEDA installed. Apply it
# separately once KEDA is present:
#
#   kubectl apply -f deploy/k8s/40-keda-scaledobject.yaml
#
# The pools work without it — 20-worker-cpu.yaml just holds a fixed replica count.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jmfts

resources:
  - 00-namespace.yaml
  - 10-config.yaml
  - 20-worker-cpu.yaml
  - 21-worker-gpu.yaml
  - 22-worker-llm.yaml

# Point both pools at wherever you pushed the images — this file is the single place a
# registry appears, so a fork does not have to edit two Deployments to move it.
#
#   kustomize edit set image jmfts-worker-cpu=registry.example/jmfts-worker-cpu:v1
#
# The two images are NAMED differently rather than tagged differently on one name, because
# kustomize matches an override by image name: a single `jmfts-worker` name would make one
# entry rewrite both pools, and the GPU pool would silently run the CPU image — which
# works, slowly, on the CPU, with the GPU idle and nothing reporting a problem.
images:
  - name: jmfts-worker-cpu
    newTag: latest
  - name: jmfts-worker-gpu
    newTag: latest
