# TEMPLATE — do not apply as-is and do not commit a filled-in copy.
#
#   kubectl -n jmfts create secret generic jmfts-worker-db \
#     --from-literal=JMFTS_DB_PASSWORD='...'
#
# Kept as an example rather than a sealed/encrypted secret so this directory carries no
# assumption about which secret manager a cluster runs.
apiVersion: v1
kind: Secret
metadata:
  name: jmfts-worker-db
  namespace: jmfts
type: Opaque
stringData:
  JMFTS_DB_PASSWORD: "CHANGE-ME"
---
# TEMPLATE — for the jmfts-worker-llm-api pool in 22-worker-llm.yaml only. Skip it entirely
# if you run no web-API worker.
#
#   kubectl -n jmfts create secret generic jmfts-worker-llm-api \
#     --from-literal=JMFTS_LLM_BASE_URL='https://api.example.com' \
#     --from-literal=JMFTS_LLM_MODEL='some-model' \
#     --from-literal=JMFTS_LLM_API_KEY='...'
#
# JMFTS_LLM_API_KEY may be empty for an unauthenticated endpoint: the Authorization header
# is sent only when the value is non-empty.
apiVersion: v1
kind: Secret
metadata:
  name: jmfts-worker-llm-api
  namespace: jmfts
type: Opaque
stringData:
  JMFTS_LLM_BASE_URL: "https://CHANGE-ME"
  JMFTS_LLM_MODEL: "CHANGE-ME"
  JMFTS_LLM_API_KEY: ""
---
# TEMPLATE — the runner key. Skip it entirely if every worker loads its own model and no
# process calls another's /runner surface.
#
#   kubectl -n jmfts create secret generic jmfts-runner \
#     --from-literal=JMFTS_RUNNER_KEY="$(openssl rand -base64 32)"
#
# ONE value, mounted on both sides: on the pod that serves /runner, and on every worker
# that posts to it. That symmetry is the handshake — inside a namespace, sharing a Secret
# is what "these two are allowed to work together" means.
#
# This is not an API token and must not be set to one. A runner key resolves to no
# principal and unlocks no document; an API token unlocks documents and cannot embed. Keep
# them different values so that stays true by inspection.
apiVersion: v1
kind: Secret
metadata:
  name: jmfts-runner
  namespace: jmfts
type: Opaque
stringData:
  JMFTS_RUNNER_KEY: "CHANGE-ME"
