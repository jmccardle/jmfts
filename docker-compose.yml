# Local JMFTS development stack: pgvector Postgres + the API, both in Docker.
#
#   docker compose up --build -d      # first run builds the image (CPU torch)
#   docker compose logs -f api        # watch startup / the auth token line
#   docker compose down               # stop (keeps data + model cache volumes)
#   docker compose down -v            # stop and WIPE the DB + HF model cache
#
# The API is reachable at http://127.0.0.1:8100 with a pinned dev bearer token
# (JMFTS_API_TOKEN below). LLM-backed endpoints (raptor, fact-extraction,
# synthesis) report "degraded" — no LLM is wired here — but documents,
# embeddings, chunking, indexing and search all work, which is everything the
# tau session store needs.
name: jmfts-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jmfts
      POSTGRES_USER: jmfts
      POSTGRES_PASSWORD: jmfts
    ports:
      # Host 5433 -> container 5432, so this never clashes with a host Postgres
      # and the tau contract tests / psql can reach it from the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql is the complete canonical DDL (extensions, all tables, the
      # CR-1 position column) — it runs once, on a fresh data volume. The
      # numbered migrations beside it are upgrade deltas for existing DBs and
      # are not needed to bootstrap. Both are package data so that an installed
      # wheel can reach them too; see jmfts_core/sql/__init__.py.
      - ./jmfts_core/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmfts -d jmfts"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The tier-3 converter: LibreOffice behind unoserver, and NOT a JMFTS. It is what makes an
  # office rendition at all — without it `render:pdf` fails PERMANENT on every .docx, .pptx
  # and .xlsx, the document settles without a page image, and its preview answers 409.
  # Choices mirror deploy/k8s/23-worker-convert.yaml rather than restating them:
  #   * NO published port. unoserver authenticates nothing, so anything that reaches 2003
  #     can convert arbitrary bytes; it is reachable from `api` on the compose network and
  #     from nowhere else, which is the ClusterIP-and-no-Ingress decision.
  #   * NO healthcheck. unoserver speaks XML-RPC, not HTTP, and a port probe says only that
  #     something listens. Liveness is the image's `--conversion-timeout`: a stuck
  #     conversion exits the process, and `restart` brings it back. The worker sees a
  #     connection error meanwhile, which is RETRYABLE, so the task waits rather than fails.
  #   * ONE replica, 4 GB ceiling. unoserver serialises conversions through one warm
  #     LibreOffice, and memory is what a large spreadsheet exhausts.
  libreoffice:
    build:
      context: .
      dockerfile: Dockerfile.libreoffice
    restart: unless-stopped
    mem_limit: 4g

  api:
    build: .
    command: uvicorn jmfts_core.rest.main:app --host 0.0.0.0 --port 8100 --reload
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: there is no health to wait for (above), and a `render:pdf`
      # claimed before unoserver is listening retries on the connection error.
      libreoffice:
        condition: service_started
    environment:
      # Settings read env with the JMFTS_ prefix (config.py: env_prefix).
      JMFTS_DB_HOST: postgres
      JMFTS_DB_PORT: "5432"
      JMFTS_DB_NAME: jmfts
      JMFTS_DB_USER: jmfts
      JMFTS_DB_PASSWORD: jmfts
      JMFTS_EMBEDDING_DEVICE: cpu
      # Pinned dev token so tau can point at this instance with a known value.
      # Override by exporting JMFTS_API_TOKEN before `docker compose up`.
      JMFTS_API_TOKEN: ${JMFTS_API_TOKEN:-jmfts-dev-local}
      # Which browser origins may call this API directly (a JSON list of explicit origins; the
      # server default is none). The two below are the standalone console's dev server in
      # jmfts-ui/, so typing this API's address into its address bar works as well as going
      # through Vite's proxy does. Add yours by exporting JMFTS_CORS_ORIGINS before `up`.
      JMFTS_CORS_ORIGINS: ${JMFTS_CORS_ORIGINS:-["http://127.0.0.1:5183","http://localhost:5183"]}
      # Where `render:pdf` sends office bytes. This process runs the ingest worker in-thread
      # (JMFTS_INGEST_WORKER_ENABLED defaults on), so it is the one that needs the URL.
      JMFTS_CONVERT_URL: http://libreoffice:2003
      # WHICH LibreOffice that is, recorded on every rendition. unoserver cannot report it,
      # so it is declared; blank means nobody measured. Read the truth with
      #   docker compose exec libreoffice soffice --version
      JMFTS_CONVERT_VERSION: ${JMFTS_CONVERT_VERSION:-}
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      # Live-reload: edits to these on the host reload the running server.
      - ./jmfts_core:/app/jmfts_core
      # The contracts jmfts_core imports. The image installs jmfts-client editable from a COPY
      # made at build time, so without this mount a bind-mounted jmfts_core that is newer than
      # the image fails at import (ImportError: cannot import name 'LlmFailure') while the
      # contracts beside it stay frozen at the build.
      - ./jmfts-client/jmfts_client:/app/jmfts-client/jmfts_client
      # The front end, for the same reason and by a different mechanism. There is no build
      # step — the bundle is ES modules the browser runs as they stand — so these need no
      # reload at all: StaticFiles resolves the directory once at mount and reads each file
      # per request, and a browser refresh is the whole edit loop.
      - ./jmfts-web/jmfts_web:/app/jmfts-web/jmfts_web
      # Persist the downloaded embedding model across restarts (first boot pulls
      # nomic-ai/modernbert-embed-base — a few hundred MB — into this volume).
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  hf_cache:
