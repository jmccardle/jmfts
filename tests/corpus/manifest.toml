note = """
A part that declares UTF-8 and carries a UTF-16 BOM in the middle of a word — the shape a
mis-transcoded file actually has, rather than one random bad byte. probe._probe_text
decodes strictly for the same reason: UnicodeDecodeError is a ValueError, so the failure is
classified PERMANENT and recorded once instead of retried.
"""

