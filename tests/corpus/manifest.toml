One megabyte of zeros in about a kilobyte. Not a zip bomb — a bomb is nested and unbounded
and this repository has no business carrying one. It is the RATIO, which is the measurable
thing: an extraction budget has to be decided from the declared uncompressed size before
decompressing, and this file is what says whether it was.
"""
