tags = ["has_content_types", "has_heading_styles", "has_duplicate_members"]
expect = "must-reject"
minimal = true
note = """
word/document.xml twice, with different text. Which copy is the document is not defined:
zipfile resolves a name to the LAST entry, other readers take the first. A package whose
text depends on the reader has no text, so it cannot be ingested honestly — and it must not
be ingested as whichever copy we happened to get.
"""

