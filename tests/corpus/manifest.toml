# The fidelity corpus — docs/OFFICE_SPEC.md Part 10, docs/CORPUS.md.
#
# One [[file]] per corpus file. `tests/corpus/manifest.py` documents the record and is the
# only thing that reads this; `tests/corpus/test_manifest.py` holds it against the bytes.
#
# Every record here is `origin = "generated"`: the bytes are built by
# `tests/corpus/fixtures.py` and no binary is committed. `sha256` is therefore a
# DETERMINISM PIN — if a fixture's hash moves, the generator changed, and the diff should
# say why. Imported records (Apache POI, LibreOffice QA, EDGAR) get `origin = "imported"`,
# a `url`, and the upstream licence; docs/CORPUS.md says what a fetch step would have to do
# and why it is not this lane's job.
#
# `format` is what jmfts_core.probe.detect_format ANSWERS, not what the extension claims.
# Where those differ the note says so — that divergence is a fact worth pinning.

